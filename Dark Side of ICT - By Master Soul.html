{t:'CISD',en:'Change in State of Delivery',d:'CISD واتە گۆڕانی دۆخی گەیاندنی نرخ: کاتێک نرخ لە ئاراستەیەکەوە (وەک چەند کاندڵی داچوون) دەگۆڕێت بۆ ئاراستەی بەرامبەر. نیشانەکەی ئەوەیە کە کاندڵێک بە لاشە دادەخرێت لە ئەوبەری open ی ئەو زنجیرە کاندڵەی پێشوو.',h:['لە داچوون: زنجیرەی کاندڵە سوورەکان دیاری بکە. CISD کاتێک دروست دەبێت کە کاندڵێک بەسەرووی open ی یەکەم کاندڵی ئەو زنجیرەیەدا دادەخرێت.','لە بەرزبوونەوە: بە پێچەوانەوە، داخستن لەژێر open ی زنجیرە کاندڵە سەوزەکان.','جیاوازی لەگەڵ MSS/CHoCH: CISD بە open ی کاندڵەکان پێوانە دەکرێت و زووتر دێت، MSS بە swing high/low ی structure.'],tr:['CISD بەتەنها بەس نییە: دەبێت لە لیکویدیتی (Sweep) یان PD Array (OB/FVG) دروست ببێت.','Entry: دوای داخستنی کاندڵی CISD، یان لە گەڕانەوە بۆ ئاستی CISD.','SL: لەوبەری لۆی/هایی زنجیرەکە. TP: لیکویدیتی بەرامبەر.'],tip:'CISD لە time frame ی بچووک (١m–١٥m) زۆرتر درۆ دەکات؛ لەگەڵ HTF bias و Killzone بەکاری بهێنە. لە وێنەکەدا هێڵی زەرد ئاستی CISDـە.',p:[70,66,62,60,56,52,48,44,52,60,72,68,84],m:[[1,'Open'],[7,'Low'],[10,'CISD'],[11,'Retest']],lv:[[70,'CISD','#e0a100'],[43,'SL','var(--dn)'],[84,'TP','var(--up)']]},
{t:'مۆدێلی بازاڕگەڕ (MMXM)',en:'Market Maker Model (MMXM)',d:'MMXM وێنەیەکی گشتییە بۆ ئەوەی چۆن نرخ لە دوای کۆکردنەوە و جووڵەی درۆ، بۆ جووڵەی ڕاستەقینە دەگوازرێتەوە. دوو شێوەی هەیە: MMBM (کڕین) و MMSM (فرۆشتن).',h:['MMBM: کۆکردنەوەی سەرەتایی ← داچوونێکی درێژ (Sell Program) بۆ لیکویدیتی خوارەوە ← Smart Money Reversal ← بەرزبوونەوە (Buy Program).','MMSM: هەمان شت بە پێچەوانەوە: بەرزبوونەوە بۆ لیکویدیتی سەرەوە، پاشان SMR و داچوون.','قۆناغەکان: Original Consolidation، Run (Sell/Buy Program)، Smart Money Reversal (SMR)، Distribution.','SMR ناوچەیەکی HTF PD Array یان لیکویدیتییەکی گەورەیە کە نرخ لێی دەگەڕێتەوە.'],tr:['HTF ببینە بۆ ناوچەی SMR (OB/FVG یان لیکویدیتی).','لەو ناوچەیە لە LTF چاوەڕێی MSS یان CISD بکە.','Entry لە FVG/OB دوای MSS، SL لەوبەری SMR، TP لە ناوەندی کۆکردنەوەکە پاشان لیکویدیتی بەرامبەر.'],tip:'MMXM مۆدێلێکی تیۆرییە (ڕێکخستنی ICT). هەموو داچوونێک MMBM نییە، بۆیە HTF bias و ناوچەی PD پێویستە.',p:[80,82,78,81,79,72,64,56,48,40,52,62,74,86,96],m:[[2,'Range'],[8,'Sell'],[9,'SMR'],[13,'Buy']],lv:[[54,'Entry','#e0a100'],[36,'SL','var(--dn)'],[80,'TP1','var(--up)'],[96,'TP2','var(--up)']]},
{t:'Liquidity Void',en:'Liquidity Void (LV)',d:'Liquidity Void ناوچەیەکی جووڵەی خێرا و یەکلایەنەیە کە کەمترین مامەڵەی تێدا کراوە (چەند کاندڵی گەورە لە ڕیزی یەک). نرخ زۆرجار دەگەڕێتەوە بۆ پڕکردنەوەی ئەو ناوچەیە.',h:['جیاوازی لەگەڵ FVG: LV ناوچەیەکی گەورەترە (چەند کاندڵ)، FVG کەلێنی ٣ کاندڵیە.','نرخ زۆرجار تا ٥٠٪ی LV دەگەڕێتەوە (بە تەواوی پڕ نابێتەوە).','لە trend وەک ناوچەی گەڕانەوە و لە ئامانج وەک مەغناتیس دەبینرێت.'],tr:['ناوچەی LV بە لاشەی کاندڵ درێژەکان دیاری بکە.','لە Bullish LV چاوەڕێی گەڕانەوە بۆ ٥٠٪ی بکە و کاندڵی ڕەتکردنەوە ببینە.','ئامانج: لیکویدیتی ناوچەی دواوە.'],tip:'ئەگەر نرخ بە لاشەی کاندڵ لەژێر LV دابخرێت بەبێ گەڕانەوە، ناوچەکە شکاوە.',p:[50,52,51,53,60,68,76,84,80,74,70,76,88],m:[[5,'LV'],[10,'Retest'],[12,'TP']],lv:[[69,'Entry','#e0a100'],[62,'SL','var(--dn)'],[88,'TP','var(--up)']]},
{t:'Propulsion Block',en:'Propulsion Block',d:'Propulsion Block کاندڵێکی دژەئاراستەیە کە لە ناو OB یەکی گەورەتر دەچێتە ژوورەوە و دواتر نرخ لێوە بەرەو ئامانج دەجووڵێت.',h:['ئاسانترین خوێندنەوە: OB یەکی بچووک لەناو OB یەکی گەورەتر یان FVG.','Entry لە open ی کاندڵی Propulsion یان ٥٠٪ی.','نیشانەی بەهێز: displacement دوای ئەو کاندڵە.'],tr:['HTF OB دیاری بکە.','لە ناو ئەو OB کاندڵی Propulsion بدۆزەرەوە (LTF).','Entry لە open ی، SL لەوبەری OB ی گەورە.'],tip:'Propulsion Block زاراوەیەکی ICT یە و لەنێو تریدەراندا ڕوونکردنەوەی جیاوازی هەیە، بۆیە ئەو شێوەیە بەکاربهێنە کە لەگەڵ structure دەگونجێت.',p:[100,96,92,88,84,86,83,92,102,110,118],m:[[4,'OB'],[6,'PB'],[8,'Displacement']],lv:[[84,'Entry','#e0a100'],[80,'SL','var(--dn)'],[118,'TP','var(--up)']]},

{t:'پرۆفایلی ڕۆژانە و هەفتانە',en:'Daily & Weekly Profiles',d:'ICT چەند شێوەی دووبارەبوووە بۆ ڕۆژ و هەفتە دیاری دەکات: کێ هایی/لۆی هەفتەکە دروست دەکات و چۆن ڕۆژەکە دەڕوات.',h:['ڕۆژ: Asia = Accumulation، London = Manipulation، New York = Distribution (هەمان Power of 3).','هەفتە: دووشەممە و سێشەممە زۆرجار هایی یان لۆی هەفتەکە (لەگەڵ Judas) دروست دەکەن، چوارشەممە ناوەند، پێنجشەممە و هەینی بەردەوامبوون یان گەڕانەوە. ئەمە شێوەیەکی باوە، نەک یاسا.','پرۆفایلەکانی هەفتە: Expansion، Reversal یان Consolidation.'],tr:['لە یەکشەممە/دووشەممە پلانی Bias دابنێ.','لە ڕۆژدا: Asia range دیاری بکە، چاوەڕێی Sweep لە London بکە.','هەر پرۆفایلێک لە ژورناڵدا تۆمار بکە (٢٠ هەفتە) بۆ دڵنیابوون.'],tip:'پرۆفایلەکان شێوەی باون نەک گەرەنتی.'},

{t:'Price Delivery (IPDA)',en:'Price Delivery',d:'Price Delivery واتە نرخ لە لیکویدیتییەکەوە دەگوازرێتەوە بۆ لیکویدیتییەکی تر، لە ڕێی PD Array. ICT دەڵێت ئەمە بەپێی IPDA (Interbank Price Delivery Algorithm) دەجووڵێت.',h:['نرخ دەچێتە لیکویدیتی (Draw)، پاشان دەگەڕێتەوە بۆ PD Array و دووبارە دەچێتەوە.','IPDA: ICT باس لە ٢٠ و ٤٠ و ٦٠ ڕۆژی پێشوو دەکات بۆ دیاریکردنی هایی/لۆی گرنگ.','Delivery دوو جۆرە: Expansion (جووڵەی خێرا) و Retracement/Reversal.'],tr:['DOL دیاری بکە (نزیکترین لیکویدیتیی گەورە).','چاوەڕێی گەڕانەوە بۆ PD Array بکە.','Entry لەوێ، TP لە DOL.'],tip:'IPDA تیۆرییەکی ICT ە و بەڵگەی سەربەخۆی نییە. وەک چوارچێوەی بیرکردنەوە بەکاری بهێنە نەک وەک ڕاستی.',p:[100,106,112,118,112,108,116,124,132,140],m:[[3,'Draw'],[5,'PD'],[9,'DOL']],lv:[[108,'Entry','#e0a100'],[103,'SL','var(--dn)'],[140,'TP','var(--up)']]},
{t:'Turtle Soup (TS)',en:'Turtle Soup',d:'Turtle Soup (TS) شێوازی هەڵەی شکاندنەوەیە (False Breakout): نرخ هایی یان لۆیەکی دیار (وەک ٢٠ ڕۆژ) دەشکێنێت بەڵام دەگەڕێتەوە. ناوەکەی لە شێوازی Turtle Traders و لیندا ڕاشکەوە هاتووە و ICT بەکاری دەهێنێت وەک Sweep + گەڕانەوە.',h:['TS Sell: نرخ هاییی ٢٠ ڕۆژە دەشکێنێت و لەژێریدا دادەخرێت.','TS Buy: نرخ لۆی ٢٠ ڕۆژە دەشکێنێت و لەسەریدا دادەخرێت.','لە ICT: ئەمە هەمان Sweep ی لیکویدیتییە، بەڵام تایبەتە بە ناوچەیەکی ڕوون.'],tr:['هایی/لۆی ڕوونی ٢٠ ڕۆژ دیاری بکە.','چاوەڕێی شکاندنەوە و داخستنەوە لە ناو ڕەنج بکە.','Entry لە کاندڵی گەڕانەوە یان FVG، SL لەوبەری فیتیل.'],tip:'ئەگەر نرخ بە لاشەی کاندڵ لەسەر هایی بەردەوام بێت، TS شکاوە (Breakout ی ڕاستەقینەیە).',p:[60,66,72,76,70,68,72,75,78,72,64,56,52,48,42,38,30,20,10,0].slice(0,12),m:[[3,'High'],[8,'Break'],[9,'TS']],lv:[[72,'Entry','#e0a100'],[80,'SL','var(--dn)'],[56,'TP','var(--up)']]},
{t:'Equal Highs و Equal Lows',en:'EQH / EQL',d:'Equal Highs/Lows (EQH/EQL) دوو یان زیاتر هایی یان لۆی لە یەک نزیک (یەک ئاست)ن. تریدەران Stop یان Breakout ی خۆیان لەسەر/ژێریان دادەنێن، بۆیە لیکویدیتییەکی زۆر کۆدەبێتەوە.',h:['EQH = لیکویدیتی سەرەوە (BSL)، EQL = لیکویدیتی خوارەوە (SSL).','ڕەنگە بە ٢ یان ٣ touch هەبێت؛ هەرچەند زیاتر، لیکویدیتی زیاترە.','نرخ زۆرجار دەچێتە ئەو ئاستە Sweep دەکات پێش ئەوەی ئاراستەی ڕاستەقینە بگرێت.'],tr:['EQH/EQL لە HTF دیاری بکە.','چاوەڕێی Sweep + MSS بکە.','Entry لە FVG/OB دوای MSS.'],tip:'جیاوازی نێوان هایییەکان بچووک بێت. ئەگەر زۆر دوور بن، EQH نین.',p:[50,60,70,62,56,68,70,64,58,72,62,66,50,40],m:[[2,'EQH'],[6,'EQH'],[9,'Sweep']],lv:[[66,'Entry','#e0a100'],[80,'SL','var(--dn)'],[40,'TP','var(--up)']]},
{t:'PD Array',en:'Premium / Discount Array',d:'PD Array ڕیزبەندیی ناوچەکانی چوونە ژوورەوەیە لە گرانترینەوە بۆ هەرزانترین. لە Premium بەدوای فرۆشتن و لە Discount بەدوای کڕین دەگەڕێیت.',v:(function(){var R=[['Premium (فرۆشتن)','Old High/EQH، Bearish OB، Bearish FVG، Bearish Breaker، Rejection Block (سەرەوە)'],['Equilibrium','٥٠٪ی ڕەنج'],['Discount (کڕین)','Old Low/EQL، Bullish OB، Bullish FVG، Bullish Breaker، Rejection Block (خوارەوە)']];var c='style="padding:6px 8px;border-bottom:1px solid var(--bd)"';return'<table style="width:100%;border-collapse:collapse;font-size:.85rem">'+R.map(function(r,i){return'<tr><td '+c+'><b style="color:'+(i==0?"#e0453a":i==2?"#0e9f6e":"var(--ac)")+'">'+r[0]+'</b></td><td '+c+'>'+r[1]+'</td></tr>'}).join('')+'</table>'})(),h:['ڕەنجی گرنگ دیاری بکە و ٥٠٪ی بنووسە.','لە Premium بەدوای فرۆشتن؛ لە Discount بەدوای کڕین.','PD Array ی HTF بەهێزترە لە LTF.'],tr:['لە HTF ڕەنج و ٥٠٪ بکێشە.','کە نرخ لە Discount بوو، بەدوای OB/FVG ی کڕین بگەڕێ.','کە لە Premium بوو، بەپێچەوانەوە.'],tip:'ڕیزبەندیی وردی PD Array لە نێوان فێرکاراندا جیاوازە؛ لەوەی ناوچەکان دەستنیشان بکە، بەهێزی لەگەڵ ناوچەی HTF.'}

{t:'نرخی کردنەوەکان (Opening Prices)',en:'Opening Prices & Gaps',d:'ICT نرخی کردنەوەی ڕۆژ و هەفتە وەک هێڵی پێوانە بەکاردەهێنێت: نرخ لە سەرووی کردنەوە گرانە و لە خوار هەرزانە.',h:['Midnight Open (True Day Open): ٠٠:٠٠ NY = ٠٧:٠٠ بە کاتی کوردستان (هاوین).','8:30 Open (کاتی هەواڵهکانی ئابووری) = ١٥:٣٠ و 9:30 Open (کردنەوەی بازاڕی سەهم) = ١٦:٣٠ لە کوردستان.','NWOG (New Week Opening Gap): کەلێنی نێوان داخستنی هەینی و کردنەوەی یەکشەممە. NDOG: هەمان لە ڕۆژانەدا. کردنەوە ١٨:٠٠ NY (٠١:٠٠ کوردستان).','Bias: ئەگەر Bias بەرزبوونەوەیە، کڕین لە خوار Midnight Open باشترە؛ بۆ داچوون فرۆشتن لە سەروو.'],tr:['Midnight Open لەسەر چارت نیشان بکە.','چاوەڕێی Judas بکە بۆ لایەنێکی ناهەمبەر (دژی Bias).','Entry لەو لایەنەی کە لەگەڵ Bias یەک دەگرێتەوە، پاش MSS.'],tip:'کاتەکان بۆ کاتی هاوینەی ئەمریکایە، لە زستان ١ کاتژمێر درەنگتر.',p:[100,98,96,94,99,104,108,112],m:[[3,'Judas'],[7,'TP']],lv:[[100,'00:00 Open','#a58bff'],[95,'Entry','#e0a100'],[92,'SL','var(--dn)'],[112,'TP','var(--up)']]},
{t:'STH و ITH و LTH و Range',en:'Swing Points & Internal/External Range',d:'ICT هایی و لۆییەکان بە سێ ئاست دابەش دەکات، و لیکویدیتی بە دوو جۆر (ناوخۆیی و دەرەکی).',h:['STH/STL: کاندڵێک کە هایی/لۆی لە هەردوو لای بەرزتر/نزمتر بێت (Short Term).','ITH/ITL: STH ێک کە لە هەردوو لای دا STH ی نزمتری هەبێت (Intermediate). LTH/LTL: هەمان بە ITH (Long Term).','External Range Liquidity: هایی و لۆیە گرنگەکان (BSL/SSL). Internal Range Liquidity: PD Array ەکان لەناو ڕەنجەکە (FVG، OB).','نرخ لە External بۆ Internal دەجووڵێت و بەپێچەوانەوە.'],tr:['بۆ trend ی گەورە LTH/LTL ببینە، بۆ Entry STH/STL.','ئەگەر نرخ بۆ External دەچێت، لە Internal (FVG/OB) Entry بدۆزەرەوە.','دوای گەیشتن بە External، چاوەڕێی گەڕانەوە بۆ Internal بکە.'],tip:'ئەم ناوانە لە نێو تریدەراندا شێوازی کارکردنی جیاواز هەیە، بۆیە هەموو شتێکی لە یەک چارت بە یەک شێوە تۆمار بکە.'},
{t:'Unicorn Model',en:'Unicorn Model',d:'Unicorn ناوچەیەکە کە Breaker Block و FVG یەکیان دەگرنەوە. یەکدەگرتنەوەی دوو PD Array هەلێکی بەهێزتر دەدات.',h:['Breaker Block: OB ی شکستخواردوو کە ئاراستەکەی گۆڕاوە.','FVG: لە دوای displacement ی هەمان جووڵە.','Unicorn = ناوچەی هاوبەشی Breaker و FVG.','دەبێت پێشتر Sweep ی لیکویدیتی ڕووی دابێت.'],tr:['Sweep + MSS ببینە.','ناوچەی هاوبەش بدۆزەرەوە.','Entry لە ناوچەکە، SL لەوبەری Breaker، TP لیکویدیتی بەرامبەر.'],tip:'ئەگەر Breaker و FVG یەک نەگرنەوە، Unicorn نییە.',p:[90,86,82,78,84,92,100,94,88,96,106,116],m:[[3,'Sweep'],[6,'Break'],[8,'Unicorn'],[11,'TP']],lv:[[89,'Entry','#e0a100'],[82,'SL','var(--dn)'],[116,'TP','var(--up)']]},
{t:'BPR و Mean Threshold',en:'Balanced Price Range',d:'BPR (Balanced Price Range) ناوچەی هاوبەشی دوو FVG ی دژی یەکە (یەکێک Bullish و یەکێک Bearish). Mean Threshold ٥٠٪ی OB یان BPR ە.',h:['BPR کاتێک دروست دەبێت نرخ کەلێنێکی بەرەو سەرەوە دروست دەکات و دواتر کەلێنێکی بەرەو خوارەوە لەسەر هەمان ناوچە.','ئەو ناوچە هاوبەشە وەک مەغناتیس و پشتگیری/بەربەست دەبینرێت.','Mean Threshold: ٥٠٪ی OB. ئەگەر نرخ بە تەواوی لەژێریدا دابخرێت، OB لاواز بووە.'],tr:['BPR لەسەر LTF بدۆزەرەوە دوای Sweep.','Entry لە ٥٠٪ی BPR.','SL لەوبەری BPR.'],tip:'BPR و Mean Threshold لەگەڵ HTF bias بەکاربهێنە؛ بەتەنها سیگناڵ نین.'},
{t:'Standard Deviations (SD)',en:'Standard Deviations',d:'SD ئامانجی پڕۆژەکراوە لە ڕەنجەکە: مەودای ڕەنجەکە دەکێشیت بە ١ و ٢ و ٢.٥ و ٤ جار لە سەرووی High (یان لە ژێر Low).',h:['ڕەنج: Asia Range یان ڕەنجی کۆکردنەوە.','بەرزبوونەوە: ئامانج = High + k × مەودا.','k ی باو: ١ و ٢ و ٢.٥ و ٤.','نموونە: High ١١٠، Low ١٠٠ (مەودا ١٠): ١٢٠، ١٣٠، ١٣٥، ١٥٠.'],tr:['دوای Judas و MSS، SD لەسەر ڕەنجەکە بکێشە.','TP١ لە SD1 یان SD2، و TP٢ لە SD2.5.','ئەگەر ڕەنجەکە گەورە بوو، SD زیاتر لە ٢ بەکارمەهێنە.'],tip:'SD ئاستێکی پێشبینیکراوە، نەک دڵنیایی؛ لەگەڵ لیکویدیتی (BSL/SSL) بەراوردی بکە.',p:[104,108,102,110,106,100,108,114,120,128,134,136],m:[[0,'Range'],[8,'Breakout']],lv:[[110,'High','#a58bff'],[100,'Low','#a58bff'],[120,'SD1','var(--up)'],[130,'SD2','var(--up)'],[135,'SD2.5','var(--up)']]},
{t:'IOFED',en:'Institutional Order Flow Entry Drill',d:'IOFED ڕیزبەندییەکی Entry ە: لە HTF نرخ دەچێتە ناو PD Array، پاشان لە LTF لە دووبارەگەڕانەوەی ناو ئەو ناوچەیە Entry دەدۆزیتەوە.',h:['١) HTF: نرخ دەچێتە ناو PD Array (OB/FVG).','٢) بڕۆ LTF (٥m یان ١m).','٣) چاوەڕێی MSS یان displacement بکە.','٤) Entry لە لێواری FVG ی LTF (یان ٥٠٪ی)، SL لەوبەری ناوچەکە.'],tr:['ئەم ٤ هەنگاوە بە ڕیز بڕۆ.','ئەگەر displacement نەبوو، داخڵ مەبە.','RR نزیکەی ١:٢ یان زیاتر.'],tip:'IOFED ناوێکی ICT ە و پێویستی بە ڕاهێنانی زۆر هەیە؛ لە دیمۆ ٣٠ جار تاقی بکەرەوە.'},
{t:'2022 Model',en:'ICT 2022 Model',d:'مۆدێلی Mentorship ی ICT ی ٢٠٢٢: هەنگاوەکانی کڕین/فرۆشتن لە Bias تا Target بە ڕیز.',h:['١) Bias ی HTF دیاری بکە و DOL.','٢) Liquidity Raid: نرخ لیکویدیتییەک (BSL/SSL) Sweep دەکات.','٣) MSS لەگەڵ displacement.','٤) FVG ی displacement دیاری بکە.','٥) Entry لە FVG لە Killzone، SL لەوبەری Sweep، TP لیکویدیتی بەرامبەر.'],tr:['Killzone: London ٠٩:٠٠–١٢:٠٠ یان NY ١٤:٠٠–١٧:٠٠ بە کاتی کوردستان.','Entry تەنها دوای کاندڵی گەڕانەوە.','RR کەمتر نەبێت لە ١:٢.'],tip:'ئەم مۆدێلە هەموو وانەکانی پێشوو (Liquidity، MSS، FVG، Killzone) دەخاتە یەک ڕیز.',p:[100,106,112,118,114,120,127,118,108,100,110,96,80,64],m:[[3,'BSL'],[6,'Sweep'],[8,'MSS'],[10,'Entry'],[13,'TP']],lv:[[109,'Entry','#e0a100'],[131,'SL','var(--dn)'],[64,'TP','var(--up)']]},
{t:'Asia Range و Seek & Destroy',en:'Asia Range & Seek and Destroy',d:'Asia Range ڕەنجی ٢٠:٠٠–٠٠:٠٠ NY (٠٣:٠٠–٠٧:٠٠ کوردستان) و Seek & Destroy ئەو هەفتەیەیە کە نرخ هەردوو لا Sweep دەکات و ئاراستەی ڕوون نییە.',h:['Asia High/Low لیکویدیتییەکی گرنگە بۆ Sweep لە London.','ڕەنجی بچووک زۆرجار مانای Sweep یەکی گەورەترە لە London (نزیکەیی).','Seek & Destroy: هەفتەیەک بێ trend ڕوون، نرخ هەردوو لای ڕەنج دەشکێنێت و دەگەڕێتەوە.','نیشانە: Sweep ی دووقات (هایی و لۆی هەمان ڕۆژ) بێ ئاراستەی ڕوون.'],tr:['Asia High/Low نیشان بکە.','ئەگەر هەردوو لا Sweep کران بێ ئاراستەی ڕوون، مامەڵە کەم بکە.','ئەگەر ڕەنجی Asia زۆر گەورەیە، Judas ی London کەمتر پێشبینی بکە.'],tip:'ئەم شێوازانە باون نەک یاسا؛ هەر هەفتەیەک لە ژورناڵدا تۆمار بکە.'},
{t:'مۆدێلی London و New York',en:'London & NY Reversal',d:'London Killzone زۆرجار Asia High/Low Sweep دەکات و پاشان گەڕانەوە؛ NY Killzone زۆرجار هایی/لۆی London Sweep دەکات.',h:['London Reversal: Sweep ی Asia High ← داچوون (یان Asia Low ← بەرزبوونەوە).','NY Reversal: Sweep ی هایی/لۆی London پاشان گەڕانەوە.','Killzone: London ٠٩:٠٠–١٢:٠٠، NY ١٤:٠٠–١٧:٠٠ کوردستان (هاوین).'],tr:['Asia range و London range نیشان بکە.','چاوەڕێی Sweep + MSS بکە.','Entry لە FVG ی دوای MSS.'],tip:'ئەم مۆدێلانە هەمیشە ڕوو نادەن؛ ئەگەر Sweep نەبوو، مامەڵە مەکە.',p:[102,104,100,103,101,104,103,108,102,96,88,80],m:[[1,'Asia High'],[7,'Sweep'],[9,'MSS']],lv:[[104,'Asia High','#a58bff'],[101,'Entry','#e0a100'],[111,'SL','var(--dn)'],[80,'TP','var(--up)']]},
{t:'Low و High Resistance Liquidity Run',en:'LRLR & HRLR',d:'نرخ بۆ لیکویدیتی دەڕوات، بەڵام ڕێگاکە جیاوازە: ڕێگای کراوە (Low Resistance) یان ڕێگای بەربەستدار (High Resistance).',h:['LRLR: لە نێوان نرخ و لیکویدیتی PD Array ی دژ نییە، جووڵەی خێرا و ڕاستەوخۆ.','HRLR: PD Array ی دژی هاتووە لە ڕێگادا (OB/FVG)، جووڵە هێواشتر و ڕەنج.','لە LRLR ئامانجی دووری دەتوانیت؛ لە HRLR ئامانجی نزیکتر باشترە.'],tr:['پێش Entry ڕێگای نێوان نرخ و TP ببینە.','ئەگەر ڕێگا پڕ بەربەستە، TP لەسەر یەکەم بەربەست دابنێ.','ئەگەر ڕێگا کراوەیە، دەتوانیت TP ی دووریش بیر لێبکەیتەوە.'],tip:'LRLR و HRLR زاراوەی کۆمەڵگەی ICT ن و جیاوازی لە فێرکاراندا هەیە.'},
{t:'Backtest و ژورناڵ',en:'Backtest & Journal',d:'پێش پارەی ڕاستەقینە، مۆدێلەکەت لەسەر داتای کۆن تاقی بکەرەوە و هەموو مامەڵەکان تۆمار بکە.',h:['TradingView Bar Replay بەکاربهێنە بۆ دووبارەکردنەوەی کۆنی چارت.','ڕێساکانت بنووسە (Bias، Entry، SL، TP) پێش دەستپێکردن.','بۆ هەر مامەڵەیەک تۆمار بکە: ڕێکەوت، Entry، SL، TP، ئەنجام بە R.','Expectancy = (ڕێژەی بردنەوە × مانای قازانج) − (ڕێژەی دۆڕان × مانای زیان). نموونە: ٤٠٪ بردنەوە و RR ١:٣ ← ٠.٤×٣ − ٠.٦×١ = ٠.٦R بۆ هەر مامەڵەیەک.'],tr:['لانیکەم ١٠٠ مامەڵە لە داتای کۆندا.','دوای ئەوە ٣٠ مامەڵە لە دیمۆ.','تەنها ئەگەر Expectancy پۆزەتیڤ بوو، بە پارەی کەم دەست پێبکە.'],tip:'ئەنجامی Backtest گەرەنتی نییە، بەڵام بەبێ ئەو دەبێتە حەدس.'},
{t:'دەروونناسی مامەڵەکردن',en:'Trading Psychology',d:'باشترین ستراتیژی بێ کۆنترۆڵی هەست کاری ناکات. ئەم وانەیە سەبارەت بە هەڵە باوەکانە.',h:['ترس: مامەڵەی باش ناکەیت یان زوو دەیبەستیتەوە.','تەماع (Greed): TP دوور دەبەیتەوە یان قەبارە زیاد دەکەیت.','FOMO: لە دوای جووڵەکە دەچیتە ژوورەوە.','Revenge Trading: دوای زیان بۆ قەرەبووکردنەوە مامەڵەی خراپ دەکەیت.'],tr:['یاسای ڕۆژانە: دوای ٢ یان ٣ زیان، بوەستە.','پێش مامەڵە لیستی پشکنین بخوێنەرەوە.','ژورناڵ بنووسە: هەستت پێش و دوای مامەڵە.','Stop پێش Entry دابنێ و مەیگۆڕە.'],tip:'ئەگەر هەست دەکەیت مامەڵەکردن کاریگەری لەسەر خەو و ژیانت هەیە، پشوو بدە و لەگەڵ کەسێکی متمانەپێکراو قسە بکە.'}

function chart(l){var p=l.p,n=p.length,W=300,H=140,C=[],all=l.p2?p.concat(l.p2):p.slice();(l.lv||[]).forEach(function(q){all.push(q[0])});p.forEach(function(v,i){var o=i?p[i-1]:v-(p[1]-v)*.4,c=v,r=Math.abs(c-o)||2,h=Math.max(o,c)+r*(.2+(i*3%4)*.12),lo=Math.min(o,c)-r*(.2+(i*5%4)*.12);C.push([o,c,h,lo]);all.push(h,lo)});var a=Math.min.apply(0,all),b=Math.max.apply(0,all),sl=(W-20)/n,bw=sl*.55,sx=function(i){return 10+sl*(i+.5)},sy=function(v){return H-22-(v-a)*(H-44)/(b-a)};var s='<svg viewBox="0 0 '+W+' '+H+'" role="img">';if(l.p2)s+='<polyline fill="none" stroke="var(--mu)" stroke-width="2" stroke-dasharray="5 4" points="'+l.p2.map(function(v,i){return sx(i)+','+sy(v)}).join(' ')+'"/>';C.forEach(function(k,i){var x=sx(i),u=k[1]>=k[0],cl=u?'var(--up)':'var(--dn)';s+='<line x1="'+x+'" x2="'+x+'" y1="'+sy(k[2])+'" y2="'+sy(k[3])+'" stroke="'+cl+'" stroke-width="1.5"/><rect x="'+(x-bw/2)+'" y="'+sy(Math.max(k[0],k[1]))+'" width="'+bw+'" height="'+Math.max(2,Math.abs(sy(k[0])-sy(k[1])))+'" fill="'+cl+'" rx="1"/>'});(l.lv||[]).forEach(function(q){var y=sy(q[0]);s+='<line x1="10" x2="290" y1="'+y+'" y2="'+y+'" stroke="'+q[2]+'" stroke-width="1.2" stroke-dasharray="4 3"/><text x="26" y="'+(y-3)+'" font-size="9" font-weight="700" text-anchor="middle" fill="'+q[2]+'">'+q[1]+'</text>'});l.m.forEach(function(k){var x=sx(k[0]),y=sy(C[k[0]][2])-5;s+='<text x="'+x+'" y="'+y+'" font-size="9" font-weight="700" text-anchor="middle" fill="var(--ac)">'+k[1]+'</text>'});return s+'</svg>'}
